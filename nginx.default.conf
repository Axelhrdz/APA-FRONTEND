server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# SPA: unknown paths serve index.html so client-side routing works
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Optional: cache hashed static assets from Vite
	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
}
